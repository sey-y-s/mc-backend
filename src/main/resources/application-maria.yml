spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/malicompetences
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        type:
          preferred_uuid_jdbc_type: CHAR