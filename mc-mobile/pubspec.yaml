name: mlc_mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.24.0"


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.7.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.3
  flutter_svg: ^2.0.10+1
  image_picker: ^1.1.2   # photo/vidéo
  file_picker: ^13.1.0  # documents PDF/Word

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.4


# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true
  assets:
    - assets/svg/
  fonts:
    - family: Fraunces               # Pour les grands titres, chiffres clés et cartes
      fonts:
        - asset: assets/fonts/Fraunces-VariableFont_SOFT,WONK,opsz,wght.ttf
    - family: PlusJakartaSans        # Pour l'interface, les menus et le texte courant
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
